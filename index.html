<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect to WiFi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 350px;
      width: 90%;
    }
    h1 {
      margin-bottom: 10px;
    }
    .wifi {
      font-size: 18px;
      margin: 10px 0;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }
    img {
      margin-top: 20px;
      width: 200px;
    }
    .note {
      font-size: 12px;
      margin-top: 10px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📶 Free WiFi</h1>

    <div class="wifi"><strong>Network:</strong> TERRASSE_Wi-Fi5</div>
    <div class="wifi"><strong>Password:</strong> <span id="pass">00000000</span></div>

    <button onclick="copyPassword()">Copy Password</button>

    <div>
      <a href="WIFI:T:WPA;S:TERRASSE_Wi-Fi5;P:123456789;;">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=WIFI:T:WPA;S:TERRASSE_Wi-Fi5;P:123456789;;" alt="WiFi QR Code">
    </a>
    </div>

    <div class="note">Scan QR or copy password to connect</div>
  </div>

  <script>
    function copyPassword() {
      const password = document.getElementById("pass").innerText;
      navigator.clipboard.writeText(password);
      alert("Password copied!");
    }
  </script>
</body>
</html>
